services:
  api:
    build: .
    image: arxml-studio-api:local
    restart: unless-stopped
    ports:
      - "${ARXML_BIND_IP:-127.0.0.1}:${ARXML_PORT:-8080}:8080"
    environment:
      ARXML_API_TOKEN: ${ARXML_API_TOKEN:?Set ARXML_API_TOKEN in .env (at least 32 characters)}
      ARXML_CORS_ORIGINS: ${ARXML_CORS_ORIGINS:-}
      GOMEMLIMIT: 768MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 15s
